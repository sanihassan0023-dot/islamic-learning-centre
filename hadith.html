<!DOCTYPE html>
<html lang="ha"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Arba'una Hadith — Hausa</title>
<style>
:root{--bg:#f4f7f2;--card:#fff;--ink:#17352b;--muted:#64756d;--accent:#16734b;--line:#dce7df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;line-height:1.7}.dark{--bg:#101a16;--card:#1b2922;--ink:#e8f3eb;--muted:#a9b9af;--accent:#66d49a;--line:#34483c}.top{background:#125b3d;color:white;padding:22px 16px;text-align:center}.top h1{margin:0;font-size:25px}.top p{margin:5px 0 0}.wrap{max-width:850px;margin:auto;padding:16px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tools input,.tools select,.tools button{padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:15px}.tools input{flex:1;min-width:160px}.tools button{cursor:pointer}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 8px #00000008}.num{color:var(--accent);font-weight:bold}.ar{font-family:"Traditional Arabic",serif;font-size:28px;line-height:2.1;text-align:right;direction:rtl;margin:12px 0}.hausa{white-space:pre-wrap}.note{color:var(--muted);font-size:13px}.nav{display:flex;justify-content:space-between;gap:10px;margin:18px 0}.nav button{background:var(--accent);color:white;border:0;border-radius:9px;padding:12px 18px}.nav button:disabled{opacity:.4}.status{color:var(--muted);padding:8px;text-align:center}
</style></head><body><header class="top"><h1>الأربعون النووية</h1><p>Arba’una Hadith — Imam an-Nawawi (Hadisai 1–42)</p></header><main class="wrap"><div class="tools"><input id="search" placeholder="Nemo hadisi ta lamba ko kalma…"><select id="jump" aria-label="Zaɓi hadisi"><option value="1">Hadisi 1</option></select><button id="theme">Yanayin duhu</button><button id="smaller">A−</button><button id="bigger">A+</button></div><div id="status" class="status">Ana ɗora hadisai…</div><section id="content"></section><div class="nav"><button id="prev">← Na baya</button><button id="next">Na gaba →</button></div><p class="note">Larabci: tarin Arba’una Nawawiyya. Fassarar Hausa a wannan shafi fassara ce mai sauƙaƙƙiya ta ma’anar hadisai; a duba sharhin malamai don ƙarin bayani. Ana buƙatar intanet domin ɗora rubutun Larabci.</p></main>
<script>
const api='https://cdn.jsdelivr.net/gh/fawazahmed0/hadith-api@1/editions/ara-nawawi.json';let items=[],current=1,font=28;
const hausa=[
  "Manzon Allah ﷺ ya ce: Lallai ayyuka suna bisa niyya, kuma kowane mutum zai samu abin da ya yi niyya. Wanda hijirarsa ta kasance saboda Allah da Manzonsa, hijirarsa ta kasance zuwa ga Allah da Manzonsa; wanda kuma hijirarsa ta kasance saboda wata duniya da zai samu ko mace da zai aura, hijirarsa ta kasance ne zuwa ga abin da ya yi hijira dominsa.",
  "Jibrilu ya tambayi Annabi ﷺ game da Musulunci, Imani da Ihsani. Musulunci shi ne shahada, sallah, zakka, azumin Ramadan da aikin Hajji ga mai iko. Imani shi ne imani da Allah, mala’ikunsa, littattafansa, manzanninsa, Ranar Lahira da ƙaddara mai kyau da marar kyau. Ihsani kuwa shi ne ka bauta wa Allah kamar kana ganinsa; idan ba ka ganinsa, to Shi yana ganinka. Hadisin ya kuma bayyana wasu alamomin Alƙiyama.",
  "An gina Musulunci a kan ginshiƙai biyar: shaidawa babu abin bautawa da gaskiya sai Allah kuma Muhammadu Manzon Allah ne; tsayar da sallah; bayar da zakka; azumin Ramadan; da Hajjin Ɗaki ga wanda ya samu iko.",
  "An tara halittar mutum a cikin mahaifiyarsa matakai-matakai. Daga nan mala’ika ya rubuta arzikinsa, ajalinsa, aikinsa da ko zai kasance cikin masu rabauta ko asara. Mutum zai yi aiki har ya kusanci makomarsa, amma abin da aka riga aka ƙaddara zai bayyana. Saboda haka a dage da kyakkyawan aiki.",
  "Duk wanda ya ƙirƙiro wani abu a cikin wannan addinin namu wanda ba ya cikinsa, to abin nan abin ƙi ne.",
  "Halal a bayyane yake, haram kuma a bayyane yake. Tsakaninsu akwai abubuwa masu shakku waɗanda mutane da yawa ba su san hukuncinsu ba. Wanda ya guji shubuha ya tsare addininsa da mutuncinsa. Akwai wani yanki a jiki: idan ya gyaru, jiki duka ya gyaru; idan ya lalace, jiki duka ya lalace. Wannan kuwa zuciya ce.",
  "Addini nasiha ne. Mun tambayi Annabi ﷺ: ga wa? Ya ce: ga Allah, Littafinsa, Manzonsa, shugabannin Musulmi da sauran Musulmi.",
  "An umurce ni in yi yaƙi da mutane har sai sun shaida babu abin bautawa da gaskiya sai Allah kuma Muhammadu Manzon Allah ne, sun tsayar da sallah, sun bayar da zakka. Idan sun aikata haka, sun kare jininsu da dukiyarsu daga gare ni sai da haƙƙin Musulunci; hisabinsu kuma yana ga Allah. (A fahimci wannan hadisi tare da sauran nassosin shari’a da ƙa’idojin ta.)",
  "Abin da na hana ku, ku nisance shi; abin da na umurce ku da shi, ku aikata gwargwadon ikonsu. Abin da ya halakar da waɗanda suka gabace ku shi ne yawan tambayoyinsu da saɓa wa annabawa.",
  "Allah Mai tsarki ne, ba ya karɓar sai mai tsarki. Allah Ya umurci muminai da abin da Ya umurci manzanni da shi: su ci halal, su yi aiki na gari. Sannan Annabi ﷺ ya ambaci mutumin da ya yi doguwar tafiya, yana roƙon Allah, amma abincinsa, abin shansa da tufafinsa haram ne; ta yaya za a karɓi addu’arsa?",
  "Ka bar abin da yake sa ka shakka, ka koma ga abin da ba ya sa ka shakka.",
  "Daga kyawun Musuluncin mutum akwai barin abin da bai shafe shi ba.",
  "Babu ɗayanku da zai cika imani har sai ya so wa ɗan’uwansa abin da yake so wa kansa.",
  "Jinin Musulmi ba ya halatta sai da ɗaya daga cikin dalilai uku: mai aure da ya yi zina, rai bisa rai, da wanda ya bar addininsa ya rabu da jama’a. (Wannan hukunci yana hannun kotun shari’a mai iko, ba na mutane su aiwatar da kansu ba.)",
  "Duk wanda ya yi imani da Allah da Ranar Lahira, ya faɗi alheri ko ya yi shiru. Wanda ya yi imani da Allah da Ranar Lahira, ya girmama maƙwabcinsa. Wanda ya yi imani da Allah da Ranar Lahira, ya girmama baƙonsa.",
  "Wani mutum ya nemi wa Annabi ﷺ wasiyya. Sai ya ce masa: Kada ka yi fushi. Mutumin ya maimaita tambayar, Annabi ﷺ kuma ya maimaita masa: Kada ka yi fushi.",
  "Allah Ya wajabta kyautatawa a kan komai. Idan za ku kashe, ku kyautata hanyar; idan za ku yanka dabba, ku kyautata yankawa. A kaifafa wuƙa, a sauƙaƙa wa dabbar.",
  "Ka ji tsoron Allah a duk inda kake; ka bi mummunan aiki da kyakkyawan aiki domin ya shafe shi; kuma ka mu’amalanci mutane da kyawawan ɗabi’u.",
  "Ka kiyaye dokokin Allah, Shi zai kiyaye ka. Ka kiyaye Allah, za ka same Shi a gabanka. Idan za ka roƙa, ka roƙi Allah; idan za ka nemi taimako, ka nemi taimakon Allah. Ka sani cewa al’umma ba za ta iya amfanar da kai ko cutar da kai ba sai da abin da Allah Ya ƙaddara. An riga an rubuta ƙaddarori.",
  "Idan ba ka da kunya, to ka aikata abin da ka ga dama. Wannan gargadi ne: rashin kunya yana kai mutum ga aikata munanan abubuwa.",
  "Ka ce: Na yi imani da Allah; sannan ka tsaya tsayin daka a kan wannan imani.",
  "Wani mutum ya tambayi Annabi ﷺ game da ayyukan da za su shigar da shi Aljanna. Annabi ﷺ ya ce ya bauta wa Allah ba tare da haɗa Shi da komai ba, ya tsayar da sallah, ya bayar da zakka, ya azumci Ramadan. Mutumin ya ce ba zai ƙara ko rage ba; Annabi ﷺ ya ce idan ya gaskata, zai rabauta.",
  "Tsarki rabin imani ne. Alhamdulillah tana cika ma’auni; Subhanallah da Alhamdulillah suna cika abin da ke tsakanin sama da ƙasa. Sallah haske ce, sadaka hujja ce, haƙuri haske ne, Alƙur’ani hujja ne a gare ka ko a kanka. Kowane mutum yana fita da safe yana sayar da ransa: ko ya ’yantar da shi ko ya halakar da shi.",
  "Kowane gaɓar mutum tana da sadaka a kowace rana da rana ta fito. Yin sulhu tsakanin mutane sadaka ne; taimakon mutum a kan abin hawansa sadaka ne; magana mai daɗi sadaka ce; kowane taku zuwa sallah sadaka ne; cire abu mai cutarwa daga hanya sadaka ne.",
  "Kada ku yi hassada, kada ku yi cinikin yaudarar juna, kada ku ƙi juna, kada ku juya wa juna baya. Ku zama bayin Allah ’yan’uwa. Musulmi ɗan’uwan Musulmi ne: kada ya zalunce shi, ya wulaƙanta shi ko ya bar shi cikin buƙata. Takawa tana nan a zuciya. Jinin mutum, dukiyarsa da mutuncinsa haramun ne ga ɗan’uwansa Musulmi.",
  "Kyakkyawan aiki shi ne abin da zuciya ta samu nutsuwa da shi, kuma zuciya ta amince da shi. Zunubi kuwa shi ne abin da yake damun zuciyarka, kuma ba ka so mutane su sani.",
  "Ka tambayi Annabi ﷺ game da ayyukan alheri da zunubi. Ya ce: Ka nemi fatawa daga zuciyarka. Kyakkyawan aiki shi ne abin da rai da zuciya suka natsu da shi; zunubi kuwa shi ne abin da ke yamutsa zuciya, ko da mutane sun ba ka fatawa akai-akai.",
  "Annabi ﷺ ya ce: Na yi muku wasiyya da ku ji tsoron Allah, ku ji kuma ku yi biyayya ko da an naɗa wani bawa a matsayin shugaba. Wanda ya rayu a cikinku zai ga saɓani mai yawa. Ku riƙe Sunnata da ta halifofi shiryayyu; ku yi riƙo da ita sosai, ku guji sababbin abubuwa a addini, domin bidi’a ɓata ce.",
  "Allah Ya wajabta wasu farillai, kada ku tozarta su; Ya sanya iyakoki, kada ku ƙetare su; Ya haramta wasu abubuwa, kada ku saɓa musu; Ya yi shiru game da wasu abubuwa saboda rahama gare ku, ba don mantuwa ba; kada ku bincika su da tsanani.",
  "Ka sani cewa Allah Ya sanya farillai, kada ka bar su; Ya sanya iyakoki, kada ka ƙetare su; Ya haramta wasu abubuwa, kada ka aikata su; kuma Ya yi shiru game da wasu abubuwa saboda rahama, don haka kada ka wahalar da kanka wajen bincikarsu.",
  "Ka nisanci abubuwan duniya, Allah zai so ka; ka nisanci abin da ke hannun mutane, mutane za su so ka.",
  "Babu cutarwa, kuma babu rama cutarwa. Kada mutum ya cutar da kansa ko wani, kuma kada a rama cuta da wata cuta.",
  "Da za a karɓi da’awar mutane kawai, da wasu za su yi da’awar dukiyar wasu da jininsu. Amma hujja tana kan mai da’awa, rantsuwa kuma tana kan wanda ya musanta.",
  "Duk wanda ya ga abin ƙyama, ya canza shi da hannunsa idan yana da iko; idan ba zai iya ba, da harshensa; idan ba zai iya ba, da zuciyarsa. Wannan shi ne mafi raunin imani.",
  "Kada ku yi hassada, kada ku ƙara farashi don yaudarar juna, kada ku ƙi juna, kada ku juya wa juna baya. Kada wani ya yi ciniki a kan cinikin ɗan’uwansa. Ku zama bayin Allah ’yan’uwa. Musulmi ɗan’uwan Musulmi ne: ba ya zaluntarsa, ba ya wulaƙanta shi, ba ya ƙaryata shi. Takawa tana nan a zuciya.",
  "Duk wanda ya yaye wa mumini wata damuwa daga damuwoyin duniya, Allah zai yaye masa wata damuwa daga damuwoyin Ranar Alƙiyama. Wanda ya sauƙaƙa wa wanda yake cikin ƙunci, Allah zai sauƙaƙa masa a duniya da Lahira. Allah yana taimakon bawa matuƙar bawan yana taimakon ɗan’uwansa.",
  "Allah Ya rubuta kyawawan ayyuka da munana, sannan Ya bayyana yadda ake rubuta su. Wanda ya yi niyyar kyakkyawan aiki amma bai aikata ba, Allah zai rubuta masa lada ɗaya cikakke; idan ya aikata, Allah zai rubuta masa lada goma har zuwa ninki da yawa. Wanda ya yi niyyar mummunan aiki amma bai aikata ba, Allah zai rubuta masa lada; idan ya aikata, za a rubuta masa zunubi ɗaya.",
  "Allah Maɗaukaki Ya ce: Wanda ya nuna ƙiyayya ga wani waliyyiNa, Na sanar da shi yaƙi. Bawana ba ya kusantarNi da wani abu mafi soyuwa gare Ni fiye da abin da Na wajabta masa. Bawana yana ci gaba da kusantarNi da nafiloli har Ina son sa. Idan Na so shi, Ina shiryar da shi, kuma Ina amsa addu’arsa.",
  "Allah Ya gafarta wa al’ummata kuskure, mantuwa, da abin da aka tilasta musu.",
  "Ka kasance a duniya kamar baƙo ko matafiyi. Ibn Umar ya kasance yana cewa: idan ka wayi gari, kada ka jira yamma; idan ka yi yamma, kada ka jira safiya. Ka yi amfani da lafiyarka kafin rashin lafiya, da rayuwarka kafin mutuwa.",
  "Babu ɗayanku da zai cika imani har sai ni na fi soyuwa gare shi fiye da mahaifinsa, ɗansa da dukkan mutane.",
  "Allah ba ya duba surorinku ko dukiyoyinku, amma Yana duba zukatanku da ayyukanku.",
  "Annabi ﷺ ya ce: Duk wanda Allah Ya nufe shi da alheri, Yana fahimtar da shi addini. Ni mai rabawa ne, Allah ne Mai bayarwa. Wannan al’umma za ta ci gaba da tsayawa kan umarnin Allah; masu saɓa musu ba za su cutar da su ba har umarnin Allah ya zo."
];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let h=items[current-1];if(!h)return;let ar=h.hadith||h.text||h.arabic||h.ar||'';document.getElementById('content').innerHTML=`<article class="card"><div class="num">Hadisi na ${current} / 42</div><div class="ar" style="font-size:${font}px">${esc(ar)}</div><h3>Fassarar / Bayanin Hausa</h3><div class="hausa">${esc(hausa[current-1]||'Bayanin Hausa zai kasance a nan.')}</div><p class="note">Arba’una Nawawiyya — Imam an-Nawawi</p></article>`;document.getElementById('jump').value=current;document.getElementById('prev').disabled=current===1;document.getElementById('next').disabled=current===42;}
fetch(api).then(r=>{if(!r.ok)throw Error('Ba a samu bayanai ba');return r.json()}).then(d=>{items=d.hadiths||d; if(!Array.isArray(items))throw Error('Tsarin bayanai bai dace ba');items=items.slice(0,42);let j=document.getElementById('jump');j.innerHTML=items.map((x,i)=>`<option value="${i+1}">Hadisi ${i+1}</option>`).join('');document.getElementById('status').textContent='An ɗora hadisai 42.';render()}).catch(e=>{document.getElementById('status').textContent='An kasa ɗora Larabci. Ka haɗa intanet sannan ka sake buɗe shafin. '+e.message});
document.getElementById('jump').onchange=e=>{current=+e.target.value;render()};document.getElementById('prev').onclick=()=>{if(current>1){current--;render()}};document.getElementById('next').onclick=()=>{if(current<42){current++;render()}};document.getElementById('bigger').onclick=()=>{font=Math.min(44,font+2);render()};document.getElementById('smaller').onclick=()=>{font=Math.max(18,font-2);render()};document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');document.getElementById('search').oninput=e=>{let q=e.target.value.trim().toLowerCase();if(!q)return;let n=Number(q);if(Number.isInteger(n)&&n>=1&&n<=42){current=n;render();return}let i=hausa.findIndex(x=>x.toLowerCase().includes(q));if(i>=0){current=i+1;render()}};
</script></body></html>
